name: Firmware Build and Release

on:
  push:
    branches: [master, main]
    tags:
      - "RELEASE-*"
  pull_request:
    branches: [master, main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.3.Rel1"

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip
          pip install scons

      - name: Build firmware (elf + hex)
        run: scons

      - name: Build firmware (lst + map)
        run: scons lst

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_number }}
          path: |
            build/AutoTitrator-Firmware.elf
            build/AutoTitrator-Firmware.hex
            build/AutoTitrator-Firmware.map
            build/AutoTitrator-Firmware.lst

      - name: Generate release checksums
        if: startsWith(github.ref, 'refs/tags/RELEASE-')
        working-directory: build
        run: |
          sha256sum AutoTitrator-Firmware.hex AutoTitrator-Firmware.elf > SHA256SUMS

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/RELEASE-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/AutoTitrator-Firmware.hex
            build/AutoTitrator-Firmware.elf
            build/SHA256SUMS
          generate_release_notes: true
          name: "Firmware Release ${{ github.ref_name }}"
